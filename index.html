<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visita a Tienda — WATU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 360px;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00e5a0;
      margin-bottom: 32px;
    }
    .status {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #222;
      border-top: 4px solid #00e5a0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error { color: #ff4d4d; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #00e5a0;
      color: #0a0a0a;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 16px;
    }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">watu</div>
    <div id="content">
      <div class="spinner"></div>
      <p class="status">Obteniendo ubicación...</p>
      <p class="sub">Por favor acepta el permiso de ubicación</p>
    </div>
  </div>

  <script>
    const FORM_ID = '1FAIpQLSd_jgAi2nD3MHHBvOl8OIr60IAS9zGV4Bmq4F_wpsmDyrVcnw';
    const ENTRY_COORDS = 'entry.1644715129';
    const ENTRY_LINK = 'entry.251756848';

    function getLocation() {
      if (!navigator.geolocation) {
        showError('Tu navegador no soporta geolocalización.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          const coords = lat + ', ' + lng;
          const mapsLink = 'https://maps.google.com/?q=' + lat + ',' + lng;

          const formUrl = 'https://docs.google.com/forms/d/e/' + FORM_ID +
            '/viewform?usp=pp_url' +
            '&' + ENTRY_COORDS + '=' + encodeURIComponent(coords) +
            '&' + ENTRY_LINK + '=' + encodeURIComponent(mapsLink);

          window.location.href = formUrl;
        },
        function(err) {
          if (err.code === 1) {
            showError('Permiso de ubicación denegado. Activa el GPS e intenta de nuevo.');
          } else if (err.code === 2) {
            showError('No se pudo obtener la ubicación. Verifica que el GPS esté activo.');
          } else {
            showError('Tiempo de espera agotado. Intenta de nuevo.');
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function showError(msg) {
      document.getElementById('content').innerHTML =
        '<p class="status error">' + msg + '</p>' +
        '<button class="btn" onclick="location.reload()">Intentar de nuevo</button>';
    }

    getLocation();
  </script>
</body>
</html>
